[project]
name = "rides"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rraveloarimanga.sudo", email = "rajesynyandrian@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.42",
    "fastapi>=0.165.0",
    "matplotlib>=3.11",  # evaluate.py: confusion matrix figure
    "mlflow>=3.18.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "streamlit>=1.67.0",
    "torch>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
rides = "rides:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dvc[s3]>=3.60",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
