name: CD

# build -> e2e test of the image -> push to Docker Hub -> deploy to Kubernetes -> smoke test (rollback on failure)
# Starts only when CI succeeded on main, on the self-hosted runner (it needs Docker and the local cluster).
#
# Repository settings:
#   secrets  DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (Docker Hub access token with read/write)
#   variable DOCKERHUB_IMAGE (optional, default louisec13012/rides-api)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# one deployment at a time, never cancelled half-way
concurrency:
  group: cd-prod
  cancel-in-progress: false

env:
  IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'louisec13012/rides-api' }}
  NAMESPACE: rides
  E2E_PORT: "8001"  # dev API uses 8000, prod API 8080
  PROD_URL: http://localhost:8080

jobs:
  deliver:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Every build gets a new, unique tag (README rule: never reuse a published tag)
      - name: Image tag
        id: meta
        run: echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      # ---- 1. Build for the runner's architecture and test the image before publishing it
      - name: Build (local)
        run: docker build -f docker/api.Dockerfile -t rides-api:e2e .

      # The e2e container needs a model without any MLflow server: an untrained one, built inside
      # the image itself (it has torch, mlflow and the rides package), in the same format as train.py.
      - name: Test model
        run: |
          rm -rf .e2e && mkdir -p .e2e
          docker run --rm -i --user root -v "$PWD/.e2e:/out" rides-api:e2e python - /out/model < tests/tiny_model.py
          chmod -R a+rX .e2e

      - name: Start the API container
        run: |
          docker rm -f rides-e2e 2>/dev/null || true
          docker run -d --name rides-e2e -p "$E2E_PORT:8000" \
            -v "$PWD/.e2e/model:/model:ro" -e MODEL_URI=/model rides-api:e2e

      - uses: astral-sh/setup-uv@v6

      - name: e2e tests (container)
        env:
          E2E_BASE_URL: http://localhost:${{ env.E2E_PORT }}
        run: uv run --no-project --with pytest --with httpx pytest tests/e2e -q -p no:cacheprovider

      - name: Container logs
        if: always()
        run: |
          docker logs rides-e2e 2>&1 | tail -50 || true
          docker rm -f rides-e2e 2>/dev/null || true

      # ---- 2. Publish: multi-architecture (amd64 for the PCs, arm64 for the Macs), as in the README
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}

      # ---- 3. Deploy to the local cluster, then check it really serves predictions
      - name: Check the cluster
        run: |
          test "$(kubectl config current-context)" = "docker-desktop" \
            || { echo "::error::kubectl context is not docker-desktop"; exit 1; }
          kubectl get deployment/api -n "$NAMESPACE"

      - name: Deploy
        id: deploy
        run: |
          kubectl set image deployment/api api="$IMAGE:${{ steps.meta.outputs.tag }}" -n "$NAMESPACE"
          kubectl annotate deployment/api -n "$NAMESPACE" --overwrite \
            kubernetes.io/change-cause="CD ${{ steps.meta.outputs.tag }} (run ${{ github.run_id }})"
          kubectl rollout status deployment/api -n "$NAMESPACE" --timeout=300s

      - name: Smoke test (prod)
        id: smoke
        env:
          E2E_BASE_URL: ${{ env.PROD_URL }}
          E2E_WAIT_SECONDS: "60"
        run: uv run --no-project --with pytest --with httpx pytest tests/e2e -q -p no:cacheprovider

      # The readiness probe keeps a broken pod out of traffic; this puts the previous image back
      - name: Rollback
        if: failure() && steps.deploy.outcome != 'skipped'
        run: |
          kubectl rollout undo deployment/api -n "$NAMESPACE"
          kubectl rollout status deployment/api -n "$NAMESPACE" --timeout=300s
          echo "::error::Deployment of ${{ steps.meta.outputs.tag }} failed and was rolled back"

      - name: Summary
        if: success()
        run: |
          {
            echo "### Deployed \`$IMAGE:${{ steps.meta.outputs.tag }}\`"
            echo "- Docker Hub: https://hub.docker.com/r/$IMAGE/tags"
            echo "- API (prod): $PROD_URL/docs"
          } >> "$GITHUB_STEP_SUMMARY"
