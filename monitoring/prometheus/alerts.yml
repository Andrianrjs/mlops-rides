# Visible in Prometheus (http://localhost:9090/alerts). Thresholds are deliberately simple for the demo.
groups:
  - name: rides-api
    rules:
      - alert: ApiDown
        expr: up{job="rides-api"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "The rides API does not answer Prometheus scrapes"

      - alert: HighErrorRate
        expr: |
          sum(rate(api_requests_total{endpoint="/v1/predict", status=~"5.."}[5m]))
            / clamp_min(sum(rate(api_requests_total{endpoint="/v1/predict"}[5m])), 1e-9) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "More than 5 % of /v1/predict requests fail with a 5xx"

      # Calibrated on a Locust baseline run (20 users, ~35 req/s, CPU): p95 about 0.4 s -> alert at 1 s
      - alert: SlowPredictions
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(api_request_duration_seconds_bucket{endpoint="/v1/predict"}[5m]))) > 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "p95 latency of /v1/predict above 1 s (baseline run: about 0.4 s)"

      # About 1 % of the rides are Reckless; a much higher share points to drift or a broken input
      - alert: RecklessShareTooHigh
        expr: |
          sum(rate(prediction_total{label="Reckless"}[30m]))
            / clamp_min(sum(rate(prediction_total[30m])), 1e-9) > 0.2
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "More than 20 % of predictions are Reckless: check the inputs (drift, unit bug)"
